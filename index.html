<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PERSONNEL MANNING CONTROL PANEL</title>
    <style>
        :root {
            --mil-bg: #111411;
            --panel-bg: #1b211b;
            --border-green: #3d523d;
            --accent-green: #4b664b;
            --tac-amber: #e5a93c;
            --tac-red: #c0392b;
            --terminal-text: #c2d4c2;
            --hud-glow: rgba(75, 102, 75, 0.4);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Consolas', 'Courier New', Courier, monospace;
        }

        body {
            background-color: var(--mil-bg);
            color: var(--terminal-text);
            padding: 24px;
            text-transform: uppercase;
        }

        .header-panel {
            border: 2px solid var(--border-green);
            background-color: var(--panel-bg);
            padding: 16px 20px;
            margin-bottom: 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .header-title {
            font-size: 20px;
            letter-spacing: 2px;
            font-weight: bold;
            color: var(--tac-amber);
        }

        .header-status {
            font-size: 12px;
            letter-spacing: 1px;
            color: var(--border-green);
        }

        .grid-container {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 16px;
        }

        .person-btn {
            background-color: var(--panel-bg);
            border: 1px solid var(--border-green);
            color: var(--terminal-text);
            padding: 14px 18px;
            text-align: left;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: space-between;
            text-decoration: none;
            position: relative;
            outline: none;
            transition: background 0.15s, border-color 0.15s, transform 0.1s;
        }

        .person-btn:hover {
            background-color: #242e24;
            border-color: var(--tac-amber);
            transform: translateY(-2px);
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.5);
        }

        .person-btn:active {
            transform: translateY(0);
        }

        .person-left {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .person-index {
            color: var(--tac-amber);
            font-weight: bold;
            font-size: 14px;
            min-width: 24px;
        }

        .person-name {
            font-size: 13px;
            font-weight: bold;
            letter-spacing: 1px;
        }

        .person-branch {
            font-size: 11px;
            font-weight: bold;
            color: #8da48d;
            background-color: rgba(61, 82, 61, 0.4);
            border: 1px solid var(--border-green);
            padding: 3px 6px;
        }

        .vacant-btn {
            border-style: dashed;
            opacity: 0.85;
        }

        .vacant-btn .person-name {
            color: var(--tac-red);
        }

        .vacant-btn:hover {
            border-color: var(--tac-red);
        }

        .log-box {
            margin-top: 24px;
            border: 1px solid var(--border-green);
            background: #0d100d;
            padding: 12px;
            font-size: 12px;
            color: #7b947b;
        }
    </style>
</head>
<body>

    <div class="header-panel">

            <div class="header-status">STATUS: UNCLASSIFIED // PERSONNEL ROSTER</div>

    </div>

    <div class="log-box" id="console-output">
        SYS_LOG: READY. SELECT A PERSONNEL ENTRY TO ENGAGE.
    </div>

    <script>
        function selectPerson(id, name, branch) {
            const consoleBox = document.getElementById('console-output');
            consoleBox.innerText = `SYS_LOG: RECORD ACCESSED >> [#${id}] ${name} | BRANCH: ${branch}`;
        }
    </script>
</body>
</html>

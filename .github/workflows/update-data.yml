name: Update Data JSON

on:
  repository_dispatch:
    types: [submit_task_data]

permissions:
  contents: write

jobs:
  append-data:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true

      - name: Validate and Append Employee Report
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const dbPath = 'data.json';
            const payload = context.payload.client_payload;

            function cleanText(value) {
              return typeof value === 'string'
                ? value.trim().replace(/\s+/g, ' ')
                : '';
            }

            function validDate(value) {
              if (
                typeof value !== 'string' ||
                !/^\d{4}-\d{2}-\d{2}$/.test(value)
              ) {
                return false;
              }

              const date = new Date(value + 'T00:00:00Z');

              return (
                Number.isFinite(date.getTime()) &&
                date.toISOString().slice(0, 10) === value
              );
            }

            // Require employee name and section.
            if (
              !payload ||
              typeof payload !== 'object' ||
              Array.isArray(payload)
            ) {
              throw new Error('Missing submission data.');
            }

            const pd = cleanText(payload.pd).toUpperCase();
            if (!/^[A-Z0-9-]+$/.test(pd) || pd === 'NOT SET') {
              throw new Error('A valid PD number from the employee page is required.');
            }

            const employeeName = cleanText(payload.employee_name);
            const section = cleanText(payload.section).toUpperCase();

            if (
              !employeeName ||
              employeeName.toLowerCase() === 'not set'
            ) {
              throw new Error('Employee name is required.');
            }

            const allowedSections = [
              'HQ',
              'SMB',
              'STB',
              'HROB',
              'EPSB'
            ];

            if (!allowedSections.includes(section)) {
              throw new Error(
                'Section must be HQ, SMB, STB, HROB, or EPSB.'
              );
            }

            if (!validDate(payload.date)) {
              throw new Error(
                'Report date must be a valid YYYY-MM-DD date.'
              );
            }

            if (
              !Array.isArray(payload.tasks) ||
              payload.tasks.length === 0
            ) {
              throw new Error(
                'The submission must contain at least one task.'
              );
            }

            // Validate tasks and derive the weekday from the date.
            const tasks = payload.tasks.map((task, index) => {
              if (
                !task ||
                typeof task !== 'object' ||
                Array.isArray(task) ||
                !validDate(task.date) ||
                !cleanText(task.task) ||
                !Number.isSafeInteger(task.time) ||
                task.time <= 0
              ) {
                throw new Error(
                  `Task ${index + 1} contains invalid data.`
                );
              }

              const description = cleanText(task.task);

              if (/^other\s*:?\s*$/i.test(description)) {
                throw new Error(
                  `Task ${index + 1}: OTHER needs a typed description.`
                );
              }

              const day = new Date(
                task.date + 'T00:00:00Z'
              ).toLocaleDateString('en-US', {
                weekday: 'long',
                timeZone: 'UTC'
              });

              return {
                date: task.date,
                day,
                task: description,
                time: task.time
              };
            });

            // Preserve existing data. Never reset an unreadable file.
            let database = [];

            if (fs.existsSync(dbPath)) {
              try {
                const raw = fs.readFileSync(dbPath, 'utf8').trim();

                if (!raw) {
                  throw new Error('The existing file is empty.');
                }

                const parsed = JSON.parse(raw);

                if (
                  parsed === null ||
                  typeof parsed !== 'object'
                ) {
                  throw new Error(
                    'Expected an array or object.'
                  );
                }

                database = Array.isArray(parsed)
                  ? parsed
                  : [parsed];
              } catch (error) {
                throw new Error(
                  'Cannot read data.json; existing data was not ' +
                  'overwritten. ' + error.message
                );
              }
            }

            const newEntry = {
              timestamp: new Date().toISOString(),
              pd,
              employee_name: employeeName,
              section,
              report_date: payload.date,
              tasks_logged: tasks
            };

            // Optional metadata. Neither field identifies the employee.
            const psn = cleanText(payload.psn);
            const uic = cleanText(payload.uic_para_lin);

            if (psn && psn.toLowerCase() !== 'not set') {
              newEntry.psn = psn;
            }

            if (uic && uic.toLowerCase() !== 'not set') {
              newEntry.uic_para_lin = uic;
            }

            database.push(newEntry);

            fs.writeFileSync(
              dbPath,
              JSON.stringify(database, null, 2) + '\n',
              'utf8'
            );

            console.log('Employee report appended successfully.');

      - name: Commit and Push
        shell: bash
        run: |
          set -euo pipefail

          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add data.json

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "update: append employee task report"
          git push origin HEAD:main

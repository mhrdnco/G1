name: Update Data JSON

on:
  repository_dispatch:
    types: [submit_task_data]

permissions:
  contents: write

jobs:
  append-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Append Task Data to data.json
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const dbPath = 'data.json';
            
            let database = [];
            if (fs.existsSync(dbPath)) {
              try {
                const raw = fs.readFileSync(dbPath, 'utf8').trim();
                database = raw ? JSON.parse(raw) : [];
                if (!Array.isArray(database)) {
                  database = [database];
                }
              } catch (e) {
                console.log("Error reading data.json, initializing fresh array.");
              }
            }
            
            const payload = context.payload.client_payload;
            
            const newEntry = {
              timestamp: new Date().toISOString(),
              employee_name: payload.name,
              section: payload.section,
              uic_para_lin: payload.uicParaLin,
              psn: payload.psn,
              report_date: payload.date,
              tasks_logged: payload.tasks
            };
            
            database.push(newEntry);
            fs.writeFileSync(dbPath, JSON.stringify(database, null, 2), 'utf8');
            console.log(`Successfully appended record for: ${payload.name}`);

      - name: Commit and Push
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add data.json
          git commit -m "update: append task tracker record to data.json [skip ci]" || echo "No changes to commit"
          git push origin main

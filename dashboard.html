<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>G1 MHRD - ADMIN WEEKLY DASHBOARD</title>
    <style>
        :root {
            --mil-black: #000000;
            --panel-bg: #0d120d;
            --sidebar-bg: #090c09;
            --border-green: #3d523d;
            --tac-amber: #e5a93c;
            --tac-red: #c0392b;
            --terminal-text: #c2d4c2;
            --active-bg: #1e291e;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Consolas', 'Courier New', Courier, monospace;
        }

        body {
            background-color: var(--mil-black);
            color: var(--terminal-text);
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            text-transform: uppercase;
        }

        /* Top Bar */
        .hud-header {
            background-color: var(--panel-bg);
            border-bottom: 2px solid var(--border-green);
            padding: 12px 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            height: 60px;
        }

        .header-title {
            font-size: 16px;
            font-weight: bold;
            letter-spacing: 2px;
            color: var(--tac-amber);
        }

        .tab-badge {
            background-color: rgba(61, 82, 61, 0.4);
            border: 1px solid var(--border-green);
            padding: 4px 10px;
            color: #8da48d;
            font-size: 12px;
            letter-spacing: 1px;
        }

        /* App Layout */
        .dashboard-container {
            display: flex;
            flex: 1;
            height: calc(100vh - 60px);
        }

        /* Left Sidebar */
        .sidebar {
            width: 310px;
            background-color: var(--sidebar-bg);
            border-right: 2px solid var(--border-green);
            overflow-y: auto;
            padding: 16px 12px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .branch-group {
            border: 1px solid rgba(61, 82, 61, 0.5);
            background-color: rgba(13, 18, 13, 0.6);
            padding: 8px;
        }

        .branch-title {
            font-size: 11px;
            font-weight: bold;
            color: var(--tac-amber);
            border-bottom: 1px dashed var(--border-green);
            padding-bottom: 4px;
            margin-bottom: 8px;
            letter-spacing: 1px;
        }

        .nav-btn {
            width: 100%;
            background-color: transparent;
            border: 1px solid var(--border-green);
            color: var(--terminal-text);
            padding: 8px 12px;
            font-size: 12px;
            text-align: left;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 6px;
            transition: all 0.15s ease;
            outline: none;
        }

        .nav-btn:hover {
            background-color: var(--active-bg);
            border-color: var(--tac-amber);
        }

        .nav-btn.active {
            background-color: var(--active-bg);
            border-color: var(--tac-amber);
            color: var(--tac-amber);
            font-weight: bold;
            box-shadow: inset 3px 0 0 var(--tac-amber);
        }

        .nav-btn.vacant {
            border-style: dashed;
        }

        .nav-btn.vacant span:first-child {
            color: var(--tac-red);
        }

        /* Main Viewport Panel */
        .viewport-panel {
            flex: 1;
            display: flex;
            flex-direction: column;
            background-color: var(--mil-black);
        }

        .viewport-header {
            background-color: var(--panel-bg);
            border-bottom: 1px solid var(--border-green);
            padding: 8px 16px;
            font-size: 11px;
            color: #7b947b;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .viewport-frame {
            flex: 1;
            width: 100%;
            height: 100%;
            border: none;
            background-color: #ffffff;
        }
    </style>
</head>
<body>

    <!-- HUD TOP -->
    <header class="hud-header">
        <div>
            <span class="header-title">G1 MHRD // ADMIN DASHBOARD</span>
        </div>
        <div>
            <span class="tab-badge">TAB 3: WEEKLY DASHBOARD</span>
        </div>
    </header>

    <!-- MAIN BODY -->
    <main class="dashboard-container">
        <!-- SIDEBAR DIRECTORY -->
        <aside class="sidebar">
            <!-- HQ -->
            <div class="branch-group">
                <div class="branch-title">HEADQUARTERS (HQ)</div>
                <button class="nav-btn active" onclick="loadDashboard(this, 'https://mhrdnco.github.io/G1/hq1.html', '01 - JAROD GROVES')">
                    <span>01. JAROD GROVES</span>
                    <span>HQ</span>
                </button>
                <button class="nav-btn" onclick="loadDashboard(this, 'https://mhrdnco.github.io/G1/hq2.html', '02 - TIMOTHY WEBSTER')">
                    <span>02. TIMOTHY WEBSTER</span>
                    <span>HQ</span>
                </button>
            </div>

            <!-- SMB -->
            <div class="branch-group">
                <div class="branch-title">SMB</div>
                <button class="nav-btn" onclick="loadDashboard(this, 'https://mhrdnco.github.io/G1/smb4.html', '03 - MIGUEL MATTEI')">
                    <span>03. MIGUEL MATTEI</span>
                    <span>SMB</span>
                </button>
                <button class="nav-btn" onclick="loadDashboard(this, 'https://mhrdnco.github.io/G1/smb1.html', '04 - MARION KWON')">
                    <span>04. MARION KWON</span>
                    <span>SMB</span>
                </button>
                <button class="nav-btn" onclick="loadDashboard(this, 'https://mhrdnco.github.io/G1/smb3.html', '05 - ANDREW TONDRE')">
                    <span>05. ANDREW TONDRE</span>
                    <span>SMB</span>
                </button>
                <button class="nav-btn" onclick="loadDashboard(this, 'https://mhrdnco.github.io/G1/smb2.html', '06 - DENISE SERRANO')">
                    <span>06. DENISE SERRANO</span>
                    <span>SMB</span>
                </button>
            </div>

            <!-- STB -->
            <div class="branch-group">
                <div class="branch-title">STB</div>
                <button class="nav-btn" onclick="loadDashboard(this, 'https://mhrdnco.github.io/G1/stb2.html', '07 - DAVID GARCIA')">
                    <span>07. DAVID GARCIA</span>
                    <span>STB</span>
                </button>
                <button class="nav-btn" onclick="loadDashboard(this, 'https://mhrdnco.github.io/G1/stb1.html', '08 - OSCAR JIMENEZ')">
                    <span>08. OSCAR JIMENEZ</span>
                    <span>STB</span>
                </button>
            </div>

            <!-- HROB -->
            <div class="branch-group">
                <div class="branch-title">HROB</div>
                <button class="nav-btn" onclick="loadDashboard(this, 'https://mhrdnco.github.io/G1/hrob3.html', '09 - KEVIN MOORE')">
                    <span>09. KEVIN MOORE</span>
                    <span>HROB</span>
                </button>
                <button class="nav-btn" onclick="loadDashboard(this, 'https://mhrdnco.github.io/G1/hrob1.html', '10 - KIMBERLY CHEATHAM')">
                    <span>10. KIMBERLY CHEATHAM</span>
                    <span>HROB</span>
                </button>
                <button class="nav-btn" onclick="loadDashboard(this, 'https://mhrdnco.github.io/G1/hrob2.html', '11 - CHANDLER VARGAS')">
                    <span>11. CHANDLER VARGAS</span>
                    <span>HROB</span>
                </button>
            </div>

            <!-- EPSB -->
            <div class="branch-group">
                <div class="branch-title">EPSB</div>
                <button class="nav-btn" onclick="loadDashboard(this, 'https://mhrdnco.github.io/G1/epsb3.html', '12 - TENNILLE WITHERSPOON')">
                    <span>12. T. WITHERSPOON</span>
                    <span>EPSB</span>
                </button>
                <button class="nav-btn" onclick="loadDashboard(this, 'https://mhrdnco.github.io/G1/epsb1.html', '13 - NAKITA MILLER')">
                    <span>13. NAKITA MILLER</span>
                    <span>EPSB</span>
                </button>
                <button class="nav-btn vacant" onclick="loadDashboard(this, 'https://mhrdnco.github.io/G1/epsb2.html', '14 - VACANT 1')">
                    <span>14. [VACANT 1]</span>
                    <span>EPSB</span>
                </button>
                <button class="nav-btn vacant" onclick="loadDashboard(this, 'https://mhrdnco.github.io/G1/epsb4.html', '15 - VACANT 2')">
                    <span>15. [VACANT 2]</span>
                    <span>EPSB</span>
                </button>
            </div>
        </aside>

        <!-- DASHBOARD DISPLAY VIEWPORT -->
        <section class="viewport-panel">
            <div class="viewport-header">
                <span id="active-target">ACTIVE RECORD: 01 - JAROD GROVES // WEEKLY DASHBOARD</span>
                <span id="source-url">SOURCE: https://mhrdnco.github.io/G1/hq1.html</span>
            </div>
            <!-- Initialized with #tab-3 and active onload listener -->
            <iframe id="dashboard-frame" class="viewport-frame" src="https://mhrdnco.github.io/G1/hq1.html#tab-3" onload="enforceTab3()"></iframe>
        </section>
    </main>

    <script>
        function loadDashboard(button, url, label) {
            // Update active button state
            document.querySelectorAll('.nav-btn').forEach(btn => btn.classList.remove('active'));
            button.classList.add('active');

            // Force tab-3 hash mapping to target url
            const targetUrl = url.includes('#') ? url.split('#')[0] + '#tab-3' : url + '#tab-3';

            // Update iframe target
            const frame = document.getElementById('dashboard-frame');
            frame.src = targetUrl;

            // Update status headers
            document.getElementById('active-target').innerText = `ACTIVE RECORD: ${label} // WEEKLY DASHBOARD`;
            document.getElementById('source-url').innerText = `SOURCE: ${url}`;
        }

        function enforceTab3() {
            try {
                const frame = document.getElementById('dashboard-frame');
                const frameDoc = frame.contentDocument || frame.contentWindow.document;

                // Query potential selector elements for "3. Weekly Dashboard" tab 
                const tabs = frameDoc.querySelectorAll('button, a, .tab, .nav-link, [role="tab"]');
                tabs.forEach(tab => {
                    const text = tab.innerText.toLowerCase();
                    if (text.includes('3.') || text.includes('weekly') || text.includes('dashboard') || text.includes('tab-3')) {
                        tab.click();
                    }
                });
            } catch (e) {
                // Safeguard against cross-origin frames; the #tab-3 hash acts as the native selector fallback
                console.log("Cross-origin security active. Page selection triggered via URL hash target (#tab-3).");
            }
        }
    </script>
</body>
</html>

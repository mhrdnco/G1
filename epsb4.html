<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task Tracker - EPSB - VACANT 2</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; background-color: #f4f7f6; }
        .header { text-align: center; background-color: #002244; color: white; padding: 15px; border-radius: 5px; position: relative; border-bottom: 4px solid #ffcc00; }
        .header h2 { margin: 0; }
        .header h4 { margin: 5px 0 0 0; font-weight: normal; color: #b3d9ff; }
        .master-save-btn { position: absolute; right: 20px; top: 20px; background-color: #28a745; color: white; border: 2px solid white; padding: 8px 15px; cursor: pointer; border-radius: 5px; font-weight: bold; }
        .master-save-btn:hover { background-color: #218838; }
        .tabs { margin-top: 20px; display: flex; border-bottom: 2px solid #002244; background: #ddd; border-radius: 5px 5px 0 0;}
        .tab { padding: 10px 20px; cursor: pointer; border: 1px solid #ccc; border-bottom: none; border-right: none; }
        .tab:last-child { border-right: 1px solid #ccc; }
        .tab.active { background-color: #002244; color: white; font-weight: bold; }
        .tab-content { display: none; padding: 20px; background-color: white; border: 1px solid #ccc; border-top: none; }
        .tab-content.active { display: block; }
        .flex-container { display: flex; gap: 20px; flex-wrap: wrap; }
        .flex-child { flex: 1; min-width: 300px; }
        .form-group { margin-bottom: 15px; }
        label { display: block; font-weight: bold; margin-bottom: 5px; color: #333; }
        input[type="date"], select, input[type="number"], input[type="text"] { width: 100%; padding: 8px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 3px;}
        button { background-color: #002244; color: white; border: none; padding: 10px 20px; cursor: pointer; border-radius: 5px; font-weight: bold; }
        button:hover { background-color: #001122; }
        button.danger { background-color: #8b0000; float: right; }
        button.danger:hover { background-color: #5c0000; }
        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        th, td { border: 1px solid #ddd; padding: 8px; text-align: left; }
        th { background-color: #002244; color: white; }
        .total-row { font-weight: bold; background-color: #e6f2ff; }
        .hidden { display: none; }
    </style>
</head>
<body>
    <div class="header">
        <button class="master-save-btn" onclick="manualSave()">💾 Master Save</button>
        <h2 id="mainTitle">Task Tracker - EPSB - VACANT 2</h2>
        <h4 id="subTitle">Name: Not Set | Section: Not Set | UIC-PARA/LIN: Not Set | PSN: Not Set</h4>
    </div>
    <div class="tabs">
        <div class="tab active" onclick="switchTab('rhythmTab', this)">1. Battle Rhythm</div>
        <div class="tab" onclick="switchTab('trackerTab', this)">2. Task Tracker</div>
        <div class="tab" onclick="switchTab('dashboardTab', this)">3. Weekly Dashboard</div>
        <div class="tab" onclick="switchTab('historyTab', this)">4. Historical Data</div>
        <div class="tab" style="background-color: #666; color: white; margin-left: auto;" onclick="promptAdmin(this)">⚙️ ADMIN</div>
    </div>
    <!-- Your TAB content divs go here -->

    <script>
        // ==========================================
        // G1 REPO DATABASE CONFIGURATION
        // ==========================================
        const REPO_OWNER = "mhrdnco";
        const REPO_NAME = "G1";
        const DATA_FILE_PATH = "data.json";
        const EMPLOYEE_KEY = "emp_15"; // UNIQUE KEY FOR VACANT 2
        const MASTER_PIN = "MHRD";
        const LOCAL_STORAGE_PREFIX = 'hr_tracker_epsb4'; // Unique to this HTML file

        // YOUR ORIGINAL VARIABLES
        const psnLookup = { /* Your full PSN lookup table */ };
        const pdTasks = [ /* Add relevant tasks for this position if known */ ];
        
        let tasks = [];
        let battleRhythm = { Monday:[], Tuesday:[], Wednesday:[], Thursday:[], Friday:[] };
        let history = [];
        let empInfo = { name: "VACANT 2", section: "EPSB", uicParaLin: "", psn: "" };
        let pieChart;

        // --- Core Functions ---
        window.onload = async function() {
            populatePsnDropdown();
            populateDropdowns();
            await loadCloudData();
            renderAll();
        };
        
        function renderAll() {
            renderBattleRhythm(); 
            updateTable(); 
            refreshHeaders();
            renderHistory();
        }

        async function loadCloudData() {
            const rawUrl = `https://raw.githubusercontent.com/${REPO_OWNER}/${REPO_NAME}/main/${DATA_FILE_PATH}?t=${Date.now()}`;
            try {
                const res = await fetch(rawUrl);
                if (res.ok) {
                    const db = await res.json();
                    if (db.employees && db.employees[EMPLOYEE_KEY]) {
                        const empRecord = db.employees[EMPLOYEE_KEY];
                        tasks = empRecord.tasks || [];
                        battleRhythm = empRecord.battleRhythm || { Monday:[], Tuesday:[], Wednesday:[], Thursday:[], Friday:[] };
                        history = empRecord.history || [];
                        empInfo = empRecord.empInfo || { name: "VACANT 2", section: "EPSB", uicParaLin: "", psn: "" };
                        console.log(`Synchronized ${EMPLOYEE_KEY} from GitHub.`);
                        return;
                    }
                }
            } catch (err) {
                console.warn("Could not reach GitHub database.", err);
            }
            loadLocalData();
        }

        function autoSave() {
            localStorage.setItem(`${LOCAL_STORAGE_PREFIX}_tasks`, JSON.stringify(tasks));
            localStorage.setItem(`${LOCAL_STORAGE_PREFIX}_br`, JSON.stringify(battleRhythm));
            localStorage.setItem(`${LOCAL_STORAGE_PREFIX}_history`, JSON.stringify(history));
            localStorage.setItem(`${LOCAL_STORAGE_PREFIX}_emp`, JSON.stringify(empInfo));
        }

        async function manualSave() {
            autoSave();
            const enteredPin = prompt("SECURE SYNC: Enter Security PIN to commit changes universally:");
            if (enteredPin !== MASTER_PIN) {
                alert("Incorrect PIN. Data saved LOCALLY only.");
                return;
            }
            let token = sessionStorage.getItem("g1_sync_token");
            if (!token) {
                token = prompt("FIRST-TIME SETUP: Paste your GitHub Personal Access Token (PAT):");
                if (!token) { alert("Sync aborted."); return; }
                sessionStorage.setItem("g1_sync_token", token);
            }
            const apiUrl = `https://api.github.com/repos/${REPO_OWNER}/${REPO_NAME}/contents/${DATA_FILE_PATH}`;
            try {
                const getRes = await fetch(apiUrl, { headers: { "Authorization": `Bearer ${token}`, "Accept": "application/vnd.github.v3+json" } });
                if (!getRes.ok) throw new Error("Could not access repository. Check your GitHub Token.");
                const fileData = await getRes.json();
                const currentContent = JSON.parse(decodeURIComponent(escape(atob(fileData.content))));
                if (!currentContent.employees) currentContent.employees = {};
                currentContent.last_updated = new Date().toISOString();
                currentContent.employees[EMPLOYEE_KEY] = { name: empInfo.name, section: empInfo.section, tasks, battleRhythm, history, empInfo };
                const newContentEncoded = btoa(unescape(encodeURIComponent(JSON.stringify(currentContent, null, 2))));
                const putRes = await fetch(apiUrl, {
                    method: "PUT",
                    headers: { "Authorization": `Bearer ${token}`, "Accept": "application/vnd.github.v3+json", "Content-Type": "application/json" },
                    body: JSON.stringify({ message: `ROSTER UPDATE: ${empInfo.name || "Employee"} (${EMPLOYEE_KEY})`, content: newContentEncoded, sha: fileData.sha })
                });
                if (putRes.ok) { alert("SUCCESS: Record committed to GitHub!"); } 
                else { const errObj = await putRes.json(); alert(`COMMIT FAILED: ${errObj.message}`); }
            } catch (err) { alert(`SYNC ERROR: ${err.message}`); }
        }
        
        function loadLocalData() {
            tasks = JSON.parse(localStorage.getItem(`${LOCAL_STORAGE_PREFIX}_tasks`)) || [];
            battleRhythm = JSON.parse(localStorage.getItem(`${LOCAL_STORAGE_PREFIX}_br`)) || { Monday:[], Tuesday:[], Wednesday:[], Thursday:[], Friday:[] };
            history = JSON.parse(localStorage.getItem(`${LOCAL_STORAGE_PREFIX}_history`)) || [];
            empInfo = JSON.parse(localStorage.getItem(`${LOCAL_STORAGE_PREFIX}_emp`)) || { name: "VACANT 2", section: "EPSB", uicParaLin: "", psn: "" };
        }
        
        // --- All your other original UI and data functions go below ---

    </script>
</body>
</html>

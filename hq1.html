<script>
// ==========================================
// G1 REPO DATABASE CONFIGURATION
// ==========================================
const REPO_OWNER = "mhrdnco";
const REPO_NAME = "G1";
const DATA_FILE_PATH = "data.json";
const EMPLOYEE_KEY = "emp_01"; // UNIQUE KEY FOR JARROD GROVES
const MASTER_PIN = "MHRD";
const LOCAL_STORAGE_PREFIX = 'hr_tracker_hq1'; // Unique to this HTML file

// YOUR ORIGINAL VARIABLES
const psnLookup = { 
    "A0485155": "W3VYAA-110-01", 
    "A0398461": "W3VYAA-110D-03", 
    "A0398447": "W3VYAA-110B-03", 
    "A042566":  "W3VYAA-110D-04", 
    "A0398459": "W3VYAA-110D-05", 
    "A0424561": "W3VYAA-110D-06", 
    "A0398446": "W3VYAA-110B-04", 
    "A0398448": "W3VYAA-110B-05", 
    "A0398449": "W3VYAA1-10B-06", 
    "A0398455": "W3VYAA-110C-04", 
    "A0398833": "W3VYAA-110D-07", 
    "A0399069": "W3VY01-100-07", 
    "A0398454": "W3VYAA-110C-03", 
    "A0399067": "W3VYAA-110C-05", 
    "A0399070": "W3VYAA-110E-01", 
    "A0398464": "W3VYAA-110E-02" 
};

const pdTasks = [ 
    "IPPS-A Command HR SME & Deployment Mgmt", 
    "MILPAY & IPPS-A Upgrade Training Execution", 
    "HR Systems Data Extraction & Analysis", 
    "Workflow Modeling & Compliance Reporting", 
    "Resolution of Personnel Software Deficiencies", 
    "Strategic Communications & Change Management", 
    "Customer Relations Management (CRM) Support", 
    "Technical Reviews of HR Allocation Models", 
    "Briefings, Conferences & IPR Presentations" 
];

let tasks = [];
let battleRhythm = { Monday:[], Tuesday:[], Wednesday:[], Thursday:[], Friday:[] };
let history = [];
let empInfo = { name: "Jarrod Groves", section: "HQ", uicParaLin: "", psn: "" };
let pieChart;

// --- Core Lifecycle Functions ---
window.onload = async function() {
    if (typeof populatePsnDropdown === "function") populatePsnDropdown();
    if (typeof populateDropdowns === "function") populateDropdowns();
    
    await loadCloudData();
    renderAll();
};

function renderAll() {
    if (typeof renderBattleRhythm === "function") renderBattleRhythm(); 
    if (typeof updateTable === "function") updateTable(); 
    if (typeof refreshHeaders === "function") refreshHeaders();
    if (typeof renderHistory === "function") renderHistory();
}

async function loadCloudData() {
    const rawUrl = `https://raw.githubusercontent.com/${REPO_OWNER}/${REPO_NAME}/main/${DATA_FILE_PATH}?t=${Date.now()}`;
    try {
        const res = await fetch(rawUrl);
        if (res.ok) {
            const db = await res.json();
            if (db.employees && db.employees[EMPLOYEE_KEY]) {
                const empRecord = db.employees[EMPLOYEE_KEY];
                tasks = empRecord.tasks || [];
                battleRhythm = empRecord.battleRhythm || { Monday:[], Tuesday:[], Wednesday:[], Thursday:[], Friday:[] };
                history = empRecord.history || [];
                empInfo = empRecord.empInfo || { name: "Jarrod Groves", section: "HQ", uicParaLin: "", psn: "" };
                console.log(`Synchronized ${EMPLOYEE_KEY} from GitHub.`);
                return;
            }
        }
    } catch (err) {
        console.warn("Could not reach GitHub database. Falling back to local storage.", err);
    }
    loadLocalData();
}

function autoSave() {
    localStorage.setItem(`${LOCAL_STORAGE_PREFIX}_tasks`, JSON.stringify(tasks));
    localStorage.setItem(`${LOCAL_STORAGE_PREFIX}_br`, JSON.stringify(battleRhythm));
    localStorage.setItem(`${LOCAL_STORAGE_PREFIX}_history`, JSON.stringify(history));
    localStorage.setItem(`${LOCAL_STORAGE_PREFIX}_emp`, JSON.stringify(empInfo));
}

async function manualSave() {
    autoSave();

    const enteredPin = prompt("SECURE SYNC: Enter Security PIN to commit changes universally:");
    if (enteredPin !== MASTER_PIN) {
        alert("Incorrect PIN. Data saved LOCALLY only.");
        return;
    }

    let token = sessionStorage.getItem("g1_sync_token");
    if (!token) {
        token = prompt("FIRST-TIME SETUP: Paste your GitHub Personal Access Token (PAT):");
        if (!token) { 
            alert("Sync aborted."); 
            return; 
        }
        sessionStorage.setItem("g1_sync_token", token);
    }

    const apiUrl = `https://api.github.com/repos/${REPO_OWNER}/${REPO_NAME}/contents/${DATA_FILE_PATH}`;

    try {
        const getRes = await fetch(apiUrl, { 
            headers: { 
                "Authorization": `Bearer ${token}`, 
                "Accept": "application/vnd.github.v3+json" 
            } 
        });
        
        if (!getRes.ok) throw new Error("Could not access repository. Verify your GitHub Token permissions.");

        const fileData = await getRes.json();
        const currentContent = JSON.parse(decodeURIComponent(escape(atob(fileData.content))));

        if (!currentContent.employees) currentContent.employees = {};
        currentContent.last_updated = new Date().toISOString();
        currentContent.employees[EMPLOYEE_KEY] = { 
            name: empInfo.name, 
            section: empInfo.section, 
            tasks, 
            battleRhythm, 
            history, 
            empInfo 
        };

        const newContentEncoded = btoa(unescape(encodeURIComponent(JSON.stringify(currentContent, null, 2))));

        const putRes = await fetch(apiUrl, {
            method: "PUT",
            headers: { 
                "Authorization": `Bearer ${token}`, 
                "Accept": "application/vnd.github.v3+json", 
                "Content-Type": "application/json" 
            },
            body: JSON.stringify({ 
                message: `ROSTER UPDATE: ${empInfo.name || "Employee"} (${EMPLOYEE_KEY})`, 
                content: newContentEncoded, 
                sha: fileData.sha 
            })
        });

        if (putRes.ok) { 
            alert("SUCCESS: Record committed to GitHub!"); 
        } else { 
            const errObj = await putRes.json(); 
            alert(`COMMIT FAILED: ${errObj.message}`); 
        }
    } catch (err) { 
        alert(`SYNC ERROR: ${err.message}`); 
    }
}

function loadLocalData() {
    tasks = JSON.parse(localStorage.getItem(`${LOCAL_STORAGE_PREFIX}_tasks`)) || [];
    battleRhythm = JSON.parse(localStorage.getItem(`${LOCAL_STORAGE_PREFIX}_br`)) || { Monday:[], Tuesday:[], Wednesday:[], Thursday:[], Friday:[] };
    history = JSON.parse(localStorage.getItem(`${LOCAL_STORAGE_PREFIX}_history`)) || [];
    empInfo = JSON.parse(localStorage.getItem(`${LOCAL_STORAGE_PREFIX}_emp`)) || { name: "Jarrod Groves", section: "HQ", uicParaLin: "", psn: "" };
}
</script>

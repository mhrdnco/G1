<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>G1 MHRD MANNING</title>
    <style>
        :root {
            --mil-bg: #000000;
            --panel-bg: #111411;
            --border-green: #3d523d;
            --accent-green: #4b664b;
            --tac-amber: #e5a93c;
            --tac-red: #c0392b;
            --terminal-text: #c2d4c2;
            --hud-glow: rgba(75, 102, 75, 0.4);
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Consolas', 'Courier New', Courier, monospace; }
        body { background-color: var(--mil-bg); color: var(--terminal-text); padding: 24px; text-transform: uppercase; }
        .header-panel { border: 2px solid var(--border-green); background-color: var(--panel-bg); padding: 16px 20px; margin-bottom: 24px; display: flex; justify-content: space-between; align-items: center; }
        .left-controls-wrapper { display: flex; align-items: center; gap: 24px; }
        .header-title { font-size: 20px; letter-spacing: 2px; font-weight: bold; color: var(--tac-amber); }
        .header-status { font-size: 12px; letter-spacing: 1px; color: var(--border-green); }
        .right-controls-wrapper { display: flex; align-items: center; gap: 24px; }
        .admin-glow-btn { background-color: #1c150b; border: 2px solid var(--tac-amber); color: var(--tac-amber); padding: 10px 18px; font-size: 13px; font-weight: bold; letter-spacing: 1.5px; cursor: pointer; text-decoration: none; outline: none; box-shadow: 0 0 10px rgba(229, 169, 60, 0.3); transition: all 0.2s ease-in-out; animation: glow-pulse 2s infinite alternate; }
        .admin-glow-btn:hover { background-color: var(--tac-amber); color: var(--mil-bg); box-shadow: 0 0 20px rgba(229, 169, 60, 0.8); transform: scale(1.03); }
        .military-clock { border: 1px solid var(--border-green); background-color: rgba(0, 0, 0, 0.5); padding: 8px 12px; font-size: 13px; font-weight: bold; color: var(--terminal-text); letter-spacing: 1.5px; display: flex; flex-direction: column; align-items: flex-start; min-width: 160px; }
        .clock-time { color: var(--tac-amber); }
        .clock-date { font-size: 10px; color: #7b947b; margin-top: 2px; }
        @keyframes glow-pulse { 0% { box-shadow: 0 0 5px rgba(229, 169, 60, 0.2); } 100% { box-shadow: 0 0 15px rgba(229, 169, 60, 0.6); } }
        .section-container { border: 1px solid var(--border-green); background-color: rgba(17, 20, 17, 0.8); margin-bottom: 24px; padding: 16px; }
        .section-header { font-size: 15px; font-weight: bold; letter-spacing: 2px; color: var(--tac-amber); border-bottom: 1px dashed var(--border-green); padding-bottom: 8px; margin-bottom: 16px; }
        .grid-container { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 12px; }
        .person-btn { background-color: var(--panel-bg); border: 1px solid var(--border-green); color: var(--terminal-text); padding: 12px 16px; text-align: left; cursor: pointer; display: flex; align-items: center; justify-content: space-between; text-decoration: none; outline: none; transition: background 0.15s, border-color 0.15s, transform 0.1s; }
        .person-btn:hover { background-color: #1b211b; border-color: var(--tac-amber); transform: translateY(-2px); box-shadow: 0 4px 8px rgba(0, 0, 0, 0.5); }
        .person-btn:active { transform: translateY(0); }
        .person-left { display: flex; align-items: center; gap: 12px; }
        .person-index { color: var(--tac-amber); font-weight: bold; font-size: 13px; min-width: 20px; }
        .person-name { font-size: 13px; font-weight: bold; letter-spacing: 1px; }
        .vacant-btn { border-style: dashed; opacity: 0.85; }
        .vacant-btn .person-name { color: var(--tac-red); }
        .vacant-btn:hover { border-color: var(--tac-red); }
        .log-box { position: sticky; bottom: 10px; border: 1px solid var(--border-green); background: #000000; padding: 14px; font-size: 12px; color: #7b947b; box-shadow: 0 -4px 10px rgba(0, 0, 0, 0.8); }
    </style>
</head>
<body>
    <!-- HUD -->
    <div class="header-panel">
        <div class="left-controls-wrapper">
            <div>
                <div class="header-title">G1 MHRD MANNING</div>
                <div class="header-status">FOR RESEARCH ANALYSIS</div>
            </div>
            <button class="admin-glow-btn" onclick="accessDashboard()">ADMIN DASHBOARD</button>
        </div>
        <div class="right-controls-wrapper">
            <div class="military-clock">
                <span class="clock-time" id="manning-clock">00:00:00</span>
                <span class="clock-date" id="manning-date">01 JAN 1970</span>
            </div>
            <div id="total-slots-display" class="header-status">TOTAL SLOTS: 0</div>
        </div>
    </div>

    <!-- Section containers will be dynamically populated by script -->
    <div id="roster-sections"></div>

    <!-- CONSOLE LOG OUTPUT -->
    <div class="log-box" id="console-output">
        QUESTIONS OR CONCERNS CONTACT >> <B>SFC ALVARADO</B>
    </div>

    <script>
        // ==========================================
        // G1 REPO DATABASE CONFIGURATION
        // ==========================================
        const REPO_OWNER = "mhrdnco";
        const REPO_NAME = "G1";
        const DATA_FILE_PATH = "data.json";

        // --- Core Functions ---
        window.onload = async function() {
            updateMilitaryClock();
            setInterval(updateMilitaryClock, 1000);
            await buildRosterFromCloud();
        };

        async function buildRosterFromCloud() {
            const rawUrl = `https://raw.githubusercontent.com/${REPO_OWNER}/${REPO_NAME}/main/${DATA_FILE_PATH}?t=${Date.now()}`;
            const rosterContainer = document.getElementById('roster-sections');
            const consoleBox = document.getElementById('console-output');

            try {
                const res = await fetch(rawUrl);
                if (!res.ok) throw new Error('Network response was not ok.');
                const db = await res.json();
                
                if (!db.employees) {
                    rosterContainer.innerHTML = '<p>Error: "employees" object not found in data.json.</p>';
                    return;
                }

                // Group employees by section
                const sections = {};
                for (const key in db.employees) {
                    const emp = db.employees[key].empInfo;
                    const section = emp.section || 'Unassigned';
                    if (!sections[section]) {
                        sections[section] = [];
                    }
                    sections[section].push({
                        id: key.replace('emp_', ''),
                        name: emp.name,
                        link: `${section.toLowerCase()}${key.replace('emp_','')}.html`, // Reconstruct link
                        vacant: emp.name.toLowerCase().includes('vacant')
                    });
                }
                
                // Sort employees within each section by ID
                for (const section in sections) {
                    sections[section].sort((a, b) => parseInt(a.id) - parseInt(b.id));
                }

                // Dynamically build the HTML for each section
                let html = '';
                const sectionOrder = ['HQ', 'SMB', 'STB', 'HROB', 'EPSB', 'Unassigned'];

                for (const sectionName of sectionOrder) {
                    if (sections[sectionName]) {
                        html += `
                            <div class="section-container">
                                <div class="section-header"><span>[${sectionName}]</span></div>
                                <div class="grid-container">
                        `;
                        sections[sectionName].forEach(emp => {
                            const btnClass = emp.vacant ? 'person-btn vacant-btn' : 'person-btn';
                            html += `
                                <a href="https://mhrdnco.github.io/G1/${emp.link}" class="${btnClass}" target="_blank" rel="noopener noreferrer">
                                    <div class="person-left">
                                        <span class="person-index">${emp.id.padStart(2, '0')}</span>
                                        <span class="person-name">${emp.name}</span>
                                    </div>
                                </a>
                            `;
                        });
                        html += `</div></div>`;
                    }
                }
                
                rosterContainer.innerHTML = html;
                document.getElementById('total-slots-display').innerText = `TOTAL SLOTS: ${Object.keys(db.employees).length}`;
                consoleBox.innerText = "SYS_LOG: ROSTER SYNCHRONIZED FROM GITHUB DATABASE.";

            } catch (error) {
                console.error("Failed to build roster:", error);
                rosterContainer.innerHTML = '<p style="color:var(--tac-red);">CRITICAL ERROR: Could not fetch or parse data.json from repository.</p>';
                consoleBox.innerText = "SYS_LOG: DATABASE CONNECTION FAILED.";
                consoleBox.style.color = "var(--tac-red)";
            }
        }
        
        function accessDashboard() {
            const pin = prompt("SECURE GATEWAY: ENTER ACCESS KEY TO DEPLOY:");
            if (pin === "5406733") {
                window.open("https://mhrdnco.github.io/G1/dashboard.html", "_blank");
            } else if (pin !== null) {
                alert("ACCESS DENIED: INVALID SECURITY PIN");
            }
        }

        function updateMilitaryClock() {
            const now = new Date();
            const hours = String(now.getHours()).padStart(2, '0');
            const minutes = String(now.getMinutes()).padStart(2, '0');
            const seconds = String(now.getSeconds()).padStart(2, '0');
            document.getElementById('manning-clock').innerText = `${hours}:${minutes}:${seconds}`;
            const day = String(now.getDate()).padStart(2, '0');
            const months = ["JAN", "FEB", "MAR", "APR", "MAY", "JUN", "JUL", "AUG", "SEP", "OCT", "NOV", "DEC"];
            const monthName = months[now.getMonth()];
            const year = now.getFullYear();
            document.getElementById('manning-date').innerText = `${day} ${monthName} ${year}`;
        }
    </script>
</body>
</html>

<script>
(() => {
  "use strict";

  // Match these values to data.json and employee-catalogs.json.
  const EMPLOYEE_NAME = "EXACT EMPLOYEE NAME";
  const EMPLOYEE_SECTION = "HQ";

  const API =
    "https://api.github.com/repos/mhrdnco/G1/contents/data.json";

  const BRANCH = "main";

  const clean = value =>
    String(value ?? "").trim().replace(/\s+/g, " ");

  const normalize = value => clean(value).toLowerCase();

  const matches = record =>
    record &&
    normalize(record.employee_name) === normalize(EMPLOYEE_NAME) &&
    normalize(record.section) === normalize(EMPLOYEE_SECTION);

  const cacheKey = "shared-tracker-v1:" + JSON.stringify([
    location.pathname,
    normalize(EMPLOYEE_NAME),
    normalize(EMPLOYEE_SECTION)
  ]);

  const clone = value => JSON.parse(JSON.stringify(value));

  const emptyRhythm = () => ({
    Monday: [],
    Tuesday: [],
    Wednesday: [],
    Thursday: [],
    Friday: []
  });

  let base = null;
  let ready = false;
  let dirty = false;
  let busy = false;
  let token = "";
  let archivedTasks = [];

  const originalRefresh = refreshHeaders;

  const escapeHTML = value =>
    String(value ?? "").replace(/[&<>"']/g, character => ({
      "&": "&amp;",
      "<": "&lt;",
      ">": "&gt;",
      '"': "&quot;",
      "'": "&#39;"
    })[character]);

  function status(message) {
    document.getElementById("sharedStatus").textContent = message;
  }

  function currentState() {
    return clone({
      tasks,
      battleRhythm,
      history,
      empInfo,
      archivedTasks
    });
  }

  function validTask(task) {
    if (
      !task ||
      typeof task.task !== "string" ||
      !clean(task.task) ||
      !Number.isSafeInteger(task.time) ||
      task.time <= 0 ||
      !/^\d{4}-\d{2}-\d{2}$/.test(task.date)
    ) {
      return false;
    }

    const date = new Date(task.date + "T00:00:00Z");

    return (
      Number.isFinite(date.getTime()) &&
      date.toISOString().slice(0, 10) === task.date
    );
  }

  function applyState(value) {
    if (
      !value ||
      !Array.isArray(value.tasks) ||
      !value.tasks.every(validTask) ||
      !Array.isArray(value.history) ||
      !value.history.every(item => typeof item === "string") ||
      !value.empInfo ||
      !value.battleRhythm ||
      !Array.isArray(value.archivedTasks) ||
      !value.archivedTasks.every(validTask)
    ) {
      throw new Error("Invalid saved tracker state.");
    }

    for (const day of Object.keys(emptyRhythm())) {
      if (
        !Array.isArray(value.battleRhythm[day]) ||
        !value.battleRhythm[day].every(item =>
          typeof item === "string"
        )
      ) {
        throw new Error("Invalid saved battle rhythm.");
      }
    }

    tasks = clone(value.tasks);
    battleRhythm = clone(value.battleRhythm);
    history = clone(value.history);
    archivedTasks = clone(value.archivedTasks);

    empInfo = {
      ...value.empInfo,
      name: EMPLOYEE_NAME,
      section: EMPLOYEE_SECTION
    };
  }

  function repaint() {
    populateAdminFields();
    originalRefresh();
    renderBattleRhythm();
    updateTable();
    updateAdminTotals();
    renderHistory();

    if (
      document.getElementById("dashboardTab")
        .classList.contains("active")
    ) {
      updateDashboard();
    }
  }

  function cacheDraft() {
    try {
      localStorage.setItem(cacheKey, JSON.stringify({
        base,
        dirty,
        value: currentState()
      }));
    } catch {
      status(
        "Browser backup failed. Use Save Shared Changes to record your work."
      );
    }
  }

  function signature(records) {
    // A changed employee report invalidates an older browser draft.
    return JSON.stringify(records.filter(matches));
  }

  function decodeContent(content) {
    const bytes = Uint8Array.from(
      atob(content.replace(/\s/g, "")),
      character => character.charCodeAt(0)
    );

    return new TextDecoder("utf-8", { fatal: true }).decode(bytes);
  }

  function encodeContent(content) {
    let binary = "";

    for (const byte of new TextEncoder().encode(content)) {
      binary += String.fromCharCode(byte);
    }

    return btoa(binary);
  }

  async function readDatabase() {
    const response = await fetch(API + "?ref=" + BRANCH, {
      cache: "no-store",
      headers: {
        Accept: "application/vnd.github+json",
        ...(token ? { Authorization: "Bearer " + token } : {})
      }
    });

    if (!response.ok) {
      throw new Error(
        "Cannot read shared data (HTTP " + response.status + ")."
      );
    }

    const file = await response.json();

    if (
      file.encoding !== "base64" ||
      typeof file.content !== "string"
    ) {
      throw new Error(
        "Shared file is too large or is not a supported file."
      );
    }

    const records = JSON.parse(decodeContent(file.content));

    if (!Array.isArray(records)) {
      throw new Error("data.json must contain an array.");
    }

    return {
      records,
      sha: file.sha
    };
  }

  function restoreReports(records) {
    const ownReports = records.filter(matches);
    const latest = ownReports.at(-1);

    if (latest?.tracker_state) {
      applyState(latest.tracker_state);
      return;
    }

    // Do not silently combine old workflow reports with newer full states.
    if (ownReports.some(report => report.tracker_state)) {
      throw new Error(
        "A legacy workflow report was added after a full shared save. " +
        "Resolve the mixed records before continuing."
      );
    }

    // Import existing reports using the newest snapshot per task week.
    const byWeek = new Map();

    for (const report of ownReports) {
      if (
        !Array.isArray(report.tasks_logged) ||
        !Number.isFinite(Date.parse(report.timestamp))
      ) {
        throw new Error(
          "An existing employee report is invalid."
        );
      }

      const grouped = new Map();

      for (const task of report.tasks_logged) {
        if (!validTask(task)) {
          throw new Error("An existing task is invalid.");
        }

        const date = new Date(task.date + "T00:00:00Z");

        date.setUTCDate(
          date.getUTCDate() - (date.getUTCDay() + 6) % 7
        );

        const week = date.toISOString().slice(0, 10);

        if (!grouped.has(week)) {
          grouped.set(week, []);
        }

        grouped.get(week).push(task);
      }

      for (const [week, list] of grouped) {
        if (
          !byWeek.has(week) ||
          Date.parse(report.timestamp) >= byWeek.get(week).time
        ) {
          byWeek.set(week, {
            time: Date.parse(report.timestamp),
            list
          });
        }
      }
    }

    applyState({
      tasks: [...byWeek.values()].flatMap(value => value.list),
      battleRhythm: emptyRhythm(),
      history: [],
      archivedTasks: [],
      empInfo: {
        name: EMPLOYEE_NAME,
        section: EMPLOYEE_SECTION,
        psn: latest?.psn || "",
        uicParaLin: latest?.uic_para_lin || ""
      }
    });
  }

  async function loadShared() {
    if (busy) return;

    if (
      dirty &&
      !confirm(
        "Replace this browser draft with the shared version? " +
        "Unsaved local edits will be discarded."
      )
    ) {
      return;
    }

    busy = true;

    try {
      const database = await readDatabase();

      restoreReports(database.records);

      base = signature(database.records);
      ready = true;
      dirty = false;

      cacheDraft();
      repaint();

      status(
        "Shared version loaded. " +
        "Edits become shared only after Save Shared Changes."
      );
    } catch (error) {
      status(error.message + " Your current draft was kept.");
    } finally {
      busy = false;
    }
  }

  async function saveShared() {
    if (busy) return;

    if (!ready) {
      status(
        "Load the shared version successfully before saving."
      );
      return;
    }

    if (!token) {
      token = (
        prompt(
          "Enter your own GitHub token with Contents: write access " +
          "to mhrdnco/G1. It is kept only in this page’s memory."
        ) || ""
      ).trim();
    }

    if (!token) return;

    busy = true;

    try {
      const captured = currentState();

      if (
        ![...captured.tasks, ...captured.archivedTasks]
          .every(validTask)
      ) {
        throw new Error(
          "Correct invalid task dates or minutes before saving."
        );
      }

      const database = await readDatabase();

      if (signature(database.records) !== base) {
        throw new Error(
          "Someone saved newer employee data. Your draft remains here. " +
          "Review or back it up, then load the shared version " +
          "before editing again."
        );
      }

      const now = new Date().toISOString();

      const entry = {
        timestamp: now,
        employee_name: EMPLOYEE_NAME,
        section: EMPLOYEE_SECTION,
        psn: captured.empInfo.psn || "",
        uic_para_lin: captured.empInfo.uicParaLin || "",
        report_date: now.slice(0, 10),

        // Keep archived work available for management analytics.
        tasks_logged: [
          ...captured.archivedTasks,
          ...captured.tasks
        ],

        // Full state restores settings, rhythm, tasks, and history.
        tracker_state: captured
      };

      database.records.push(entry);

      const response = await fetch(API, {
        method: "PUT",
        headers: {
          Accept: "application/vnd.github+json",
          "Content-Type": "application/json",
          Authorization: "Bearer " + token
        },
        body: JSON.stringify({
          branch: BRANCH,
          sha: database.sha,
          message:
            "Save tracker: " +
            EMPLOYEE_NAME +
            " / " +
            EMPLOYEE_SECTION,
          content: encodeContent(
            JSON.stringify(database.records, null, 2) + "\n"
          )
        })
      });

      if (!response.ok) {
        if (response.status === 401 || response.status === 403) {
          token = "";
        }

        throw new Error(
          "Shared save failed (HTTP " + response.status + "). " +
          "Your draft remains. A conflicting save requires " +
          "a refresh and review."
        );
      }

      const saved = await response.json();

      base = signature(database.records);

      dirty =
        JSON.stringify(currentState()) !==
        JSON.stringify(captured);

      cacheDraft();

      status(
        "Saved to GitHub. Commit " +
        saved.commit.sha.slice(0, 7) +
        ". " +
        (
          dirty
            ? "New edits made during saving still need another save."
            : "Employees can use Load Shared Version to receive these changes."
        )
      );
    } catch (error) {
      status(error.message);
    } finally {
      busy = false;
    }
  }

  // Ordinary edits remain browser drafts until explicitly shared.
  autoSave = function() {
    dirty = true;
    cacheDraft();

    status(
      "Draft changed in this browser. " +
      "Click Save Shared Changes to record it for everyone."
    );
  };

  // Both existing save buttons now use the same shared save.
  manualSave = saveShared;
  transmitToGitHubAction = saveShared;

  updateAdminData = function() {
    empInfo.name = EMPLOYEE_NAME;
    empInfo.section = EMPLOYEE_SECTION;
    empInfo.psn = document.getElementById("empPsn").value;
    empInfo.uicParaLin =
      document.getElementById("empUicParaLin").value.trim();

    autoSave();
    originalRefresh();
  };

  clearAdminInfo = function() {
    alert(
      "Name and section identify this shared record. " +
      "Change them consistently in the HTML and JSON files; " +
      "they cannot be cleared here."
    );
  };

  // The old visible PIN was not an authorization boundary.
  // GitHub write permission controls whether a shared save succeeds.
  promptAdmin = function(element) {
    switchTab("adminTab", element);
    populateAdminFields();
    updateAdminTotals();
  };

  // Safely display typed task descriptions.
  renderBattleRhythm = function() {
    for (const day of Object.keys(emptyRhythm())) {
      document.querySelector(
        "#cal-" + day + " .tasks"
      ).innerHTML = battleRhythm[day].map((task, index) => `
        <div class="br-task">
          ${escapeHTML(task)}
          <button onclick="removeRhythmTask('${day}', ${index})">
            Remove
          </button>
        </div>
      `).join("");
    }
  };

  updateTable = function() {
    document.querySelector("#taskTable tbody").innerHTML =
      tasks.map((task, index) => `
        <tr>
          <td>${escapeHTML(task.date)}</td>
          <td>${escapeHTML(task.day)}</td>
          <td>${escapeHTML(task.task)}</td>
          <td>${task.time}</td>
          <td>
            <button onclick="deleteTask(${index})">
              Remove
            </button>
          </td>
        </tr>
      `).join("");
  };

  function summaryHTML() {
    const sums = new Map();

    for (const task of tasks) {
      sums.set(
        task.task,
        (sums.get(task.task) || 0) + task.time
      );
    }

    return [...sums].map(([task, time]) => `
      <tr>
        <td>${escapeHTML(task)}</td>
        <td>${time}</td>
        <td>${(time / 60).toFixed(2)}</td>
      </tr>
    `).join("");
  }

  updateDashboard = function() {
    document.querySelector("#summaryTable tbody").innerHTML =
      summaryHTML();

    const total = tasks.reduce(
      (sum, task) => sum + task.time,
      0
    );

    document.getElementById("totalMins").textContent = total;
    document.getElementById("totalHrs").textContent =
      (total / 60).toFixed(2);
  };

  updateAdminTotals = function() {
    const used = new Set(
      tasks.map(task => normalize(task.task))
    );

    document.getElementById("adminAllTasks").innerHTML =
      pdTasks.map(task =>
        "<li>" + escapeHTML(task) + "</li>"
      ).join("");

    document.getElementById("adminReportedTasks").innerHTML =
      [...new Set(tasks.map(task => task.task))]
        .map(task => "<li>" + escapeHTML(task) + "</li>")
        .join("") || "<li>None</li>";

    document.getElementById("adminUnreportedTasks").innerHTML =
      pdTasks
        .filter(task => !used.has(normalize(task)))
        .map(task => "<li>" + escapeHTML(task) + "</li>")
        .join("") || "<li>None</li>";

    document.querySelector("#adminTotalTable tbody").innerHTML =
      summaryHTML();

    const total = tasks.reduce(
      (sum, task) => sum + task.time,
      0
    );

    document.getElementById("adminTotalMins").textContent = total;
    document.getElementById("adminTotalHrs").textContent =
      (total / 60).toFixed(2);
  };

  renderHistory = function() {
    const root = document.getElementById("historyContainer");
    root.replaceChildren();

    // Rebuild only the text/table elements used by existing archives.
    const allowed = new Set([
      "DIV", "H4", "TABLE", "THEAD",
      "TBODY", "TFOOT", "TR", "TH", "TD"
    ]);

    function copyNode(node, parent) {
      if (node.nodeType === 3) {
        parent.appendChild(
          document.createTextNode(node.textContent)
        );
        return;
      }

      if (
        node.nodeType !== 1 ||
        !allowed.has(node.tagName)
      ) {
        return;
      }

      const element = document.createElement(
        node.tagName.toLowerCase()
      );

      if (node.tagName === "DIV") {
        element.className = "archive-block";
      }

      for (const child of node.childNodes) {
        copyNode(child, element);
      }

      parent.appendChild(element);
    }

    for (const html of history) {
      const parsed = new DOMParser().parseFromString(
        html,
        "text/html"
      );

      for (const child of parsed.body.childNodes) {
        copyNode(child, root);
      }
    }
  };

  archiveWeek = function() {
    if (!tasks.length) {
      alert("No tasks to archive.");
      return;
    }

    if (
      !confirm(
        "Move current tasks into history? " +
        "Save Shared Changes afterward to share the archive."
      )
    ) {
      return;
    }

    updateDashboard();

    history.unshift(
      "<div><h4>Archived " +
      escapeHTML(new Date().toLocaleDateString()) +
      "</h4>" +
      document.getElementById("summaryTable").outerHTML +
      "</div>"
    );

    archivedTasks.push(...clone(tasks));
    tasks = [];
    battleRhythm = emptyRhythm();

    autoSave();
    repaint();

    switchTab(
      "historyTab",
      document.querySelectorAll(".tab")[3]
    );
  };

  clearHistory = function() {
    if (
      confirm(
        "Clear archive displays and their tasks from the current " +
        "shared state? Earlier GitHub records remain in history."
      )
    ) {
      history = [];
      archivedTasks = [];
      autoSave();
      renderHistory();
    }
  };

  addTask = function() {
    const date = document.getElementById("taskDate").value;
    let task = document.getElementById("taskSelect").value;
    const time = Number(
      document.getElementById("taskTime").value
    );

    if (task === "OTHER") {
      const description =
        document.getElementById("trackerOtherTask").value.trim();

      if (!description) {
        alert("Type the Other task description.");
        return;
      }

      task = "OTHER: " + description;
    }

    if (!validTask({ date, task, time })) {
      alert(
        "Enter a valid date, task, and whole number of minutes."
      );
      return;
    }

    const day = new Date(
      date + "T00:00:00Z"
    ).toLocaleDateString("en-US", {
      weekday: "long",
      timeZone: "UTC"
    });

    tasks.push({ date, day, task, time });

    autoSave();
    updateTable();

    document.getElementById("taskTime").value = "";
    document.getElementById("taskSelect").value = "";
    document.getElementById("trackerOtherTask").value = "";

    checkTrackerOther();
  };

  window.onload = async function() {
    const panel = document.createElement("div");

    panel.style =
      "padding:15px;margin:15px 0;background:#e8f2f8;" +
      "border:1px solid #aac4d4";

    panel.innerHTML = `
      <button id="loadSharedButton">Load Shared Version</button>
      <button id="forgetTokenButton">Forget GitHub Token</button>
      <p id="sharedStatus" role="status"></p>
    `;

    document.querySelector(".header").after(panel);

    document.getElementById("loadSharedButton").onclick =
      loadShared;

    document.getElementById("forgetTokenButton").onclick = () => {
      token = "";
      status("Token removed from this page’s memory.");
    };

    document.querySelector(".master-save-btn").textContent =
      "Save Shared Changes";

    document.getElementById("transmitBtn").textContent =
      "SAVE SHARED CHANGES";

    document.querySelectorAll("h3,h4").forEach(element => {
      element.textContent = element.textContent
        .replace("Unreported / Missed", "No Reported Use")
        .replace("Current Week", "Current Tracker");
    });

    document.querySelector(
      "#adminTab .admin-panel h3"
    ).textContent =
      "Employee Settings — saving requires GitHub write access";

    // This test uses the summary table instead of the original chart.
    document.querySelector(".chart-container").style.display =
      "none";

    populatePsnDropdown();
    populateDropdowns();

    empInfo = {
      name: EMPLOYEE_NAME,
      section: EMPLOYEE_SECTION,
      psn: "",
      uicParaLin: ""
    };

    document.getElementById("empName").readOnly = true;
    document.getElementById("empSection").disabled = true;

    if (
      EMPLOYEE_NAME === "EXACT EMPLOYEE NAME" ||
      !clean(EMPLOYEE_NAME)
    ) {
      repaint();

      status(
        "Set EMPLOYEE_NAME in this script to the exact name in " +
        "data.json and employee-catalogs.json before testing."
      );

      return;
    }

    try {
      const saved = JSON.parse(
        localStorage.getItem(cacheKey) || "null"
      );

      if (saved?.dirty) {
        applyState(saved.value);
        base = saved.base;
        dirty = true;
        ready = typeof base === "string";

        repaint();

        status(
          "Recovered an unsaved browser draft. Shared saving checks " +
          "for newer employee changes before writing."
        );

        return;
      }
    } catch {
      status("Could not recover the browser draft.");
    }

    repaint();
    await loadShared();

    if (location.hash === "#tab-3") {
      switchTab(
        "dashboardTab",
        document.querySelectorAll(".tab")[2]
      );
    }
  };

  window.addEventListener("beforeunload", event => {
    if (dirty) {
      event.preventDefault();
      event.returnValue = "";
    }
  });
})();
</script>
